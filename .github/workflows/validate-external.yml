name: validate-external
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  authorize:
    if: vars.RUN_LEGACY_VALIDATION == 'true' && github.repository != github.event.pull_request.head.repo.full_name
    environment:
      ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ✓
  build:
    if: vars.RUN_LEGACY_VALIDATION == 'true'
    needs: authorize
    uses: ./.github/workflows/validate.yml
    secrets:
      SECRET_NAME: ${{ secrets.SECRET_NAME }}
      SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
      SECRET_ENCRYPTION: ${{ secrets.SECRET_ENCRYPTION }}

