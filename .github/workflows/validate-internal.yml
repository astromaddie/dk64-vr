name: validate-internal
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    if: vars.RUN_LEGACY_VALIDATION == 'true' && (github.event_name == 'push' || github.repository == github.event.pull_request.head.repo.full_name)
    uses: ./.github/workflows/validate.yml
    secrets: inherit
